<!DOCTYPE html>
<html>
<head>
    <title>Login - Smart Diabetes System</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background: url('/static/l1.webp') no-repeat center center fixed;
            background-size: cover;
            background-color: #f0f0f0;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-box {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Login</h2>
        <form method="post">
            <label>Name:</label><br>
            <input type="text" name="username" required><br>
            <label>Age:</label><br>
            <input type="number" name="age" required><br>
            <input type="submit" value="Next">
        </form>
    </div>
</body>
</html>
